name: Feature request
description: An idea to make KN5 Garage better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe what you're trying to do and what's missing or awkward today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
  - type: textarea
    id: extra
    attributes:
      label: Anything else (examples, screenshots, other tools that do it)
